# A tag vX.Y.Z → CI checks → ghcr.io/mkornas/mk-cms:X.Y.Z and :latest, plus a GitHub Release.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/mkornas/mk-cms
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version the API reports
        run: |
          tag=${GITHUB_REF_NAME#v}
          have=$(node -p "require('./apps/api/package.json').version")
          [ "$tag" = "$have" ] || { echo "::error::tag v$tag but apps/api/package.json says $have"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
