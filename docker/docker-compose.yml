name: mk-cms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mkcms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mkcms}
      POSTGRES_DB: ${DB_NAME:-mkcms}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mkcms} -d ${DB_NAME:-mkcms}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO is only for MEDIA_DRIVER=s3: `docker compose --profile s3 up -d minio`.
  # (MinIO stopped publishing to Docker Hub; the images live on quay.io.)
  minio:
    profiles: ['s3']
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mkcms}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mkcms-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

  # One-shot: create the media bucket and make it publicly readable.
  minio-setup:
    profiles: ['s3']
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mkcms}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mkcms-secret}
      S3_BUCKET: ${S3_BUCKET:-mkcms-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo waiting for minio; sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'bucket ready'; "

  # The CMS itself: API + admin in one container. `docker compose --profile full up`
  # runs everything; without the profile only postgres/redis (+ minio) start, for
  # `pnpm api:dev` / `pnpm admin:dev` on the host.
  api:
    profiles: ['full']
    image: ghcr.io/mkornas/mk-cms:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # `development` so the quick start boots with the placeholder secrets below
      # (and serves the Apollo Sandbox). Set NODE_ENV=production for anything
      # real: it refuses the defaults.
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mkcms}
      DB_PASSWORD: ${DB_PASSWORD:-mkcms}
      DB_NAME: ${DB_NAME:-mkcms}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@mk-cms.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-changeme123}
      SEED_DEMO: ${SEED_DEMO:-false}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:4000}
    volumes:
      - apidata:/data
    ports:
      - '${API_PORT:-4000}:4000'

volumes:
  pgdata:
  redisdata:
  miniodata:
  apidata:
