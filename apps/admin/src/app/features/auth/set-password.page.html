<mk-card>
  <h1 class="title">Set your password</h1>
  <p class="subtitle">Choose a password to activate your account.</p>

  @if (error(); as msg) {
    <mk-alert tone="danger" style="margin-bottom: var(--mk-space-4)">{{ msg }}</mk-alert>
  }

  @if (hasToken()) {
    <form (submit)="submit($event)">
      <div class="fields">
        <mk-form-field label="New password" [required]="true" hint="At least {{ minLength }} characters.">
          <input
            mkInput
            type="password"
            name="password"
            autocomplete="new-password"
            [value]="password()"
            (input)="update($event.target, password.set)"
            required
          />
        </mk-form-field>

        <mk-form-field label="Confirm password" [required]="true">
          <input
            mkInput
            type="password"
            name="confirm"
            autocomplete="new-password"
            [value]="confirm()"
            (input)="update($event.target, confirm.set)"
            required
          />
        </mk-form-field>
      </div>

      <div class="actions">
        <button mkButton tone="primary" type="submit" [loading]="submitting()" [disabled]="!canSubmit()">
          Set password
        </button>
      </div>
    </form>
  } @else {
    <mk-alert tone="danger">
      This invite link is missing or invalid. Please use the link from your invitation email.
    </mk-alert>
  }
</mk-card>
